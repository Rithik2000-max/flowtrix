version: '3.8'

services:
  postgres-documentdb:
    image: ghcr.io/ferretdb/postgres-documentdb:17
    restart: always
    environment:
      POSTGRES_USER: ferretdb
      POSTGRES_PASSWORD: ferretdb_secret
      POSTGRES_DB: ferretdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - wekan-ferretdb

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2
    restart: always
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://ferretdb:ferretdb_secret@postgres-documentdb/ferretdb
    ports:
      - "127.0.0.1:27017:27017"   # Only localhost for security
    depends_on:
      - postgres-documentdb
    networks:
      - wekan-ferretdb

  wekan-app:
    image: ghcr.io/wekan/wekan:latest
    restart: always
    networks:
      - wekan-ferretdb
    ports:
      - "8081:8080"
    environment:
      MONGO_URL: mongodb://ferretdb:ferretdb_secret@ferretdb:27017/wekan?authMechanism=PLAIN
      ROOT_URL: http://localhost:8081          # Change to your real URL
      PORT: 8080
      WITH_API: true
      WRITABLE_PATH: /data
      MAIL_URL: ""                             # Add your mail settings
      MAIL_FROM: ""
    volumes:
      - wekan-data:/data
    depends_on:
      - ferretdb

volumes:
  postgres-data:
  wekan-data:

networks:
  wekan-ferretdb:
    driver: bridge